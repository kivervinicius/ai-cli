linters:
  disable:
    - errcheck
  enable:
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - whitespace
    - copyloopvar
    - durationcheck

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go$
      linters:
        - unparam
  max-issues-per-linter: 50
  max-same-issues: 5
