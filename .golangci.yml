version: "2"

linters:
  default: standard
  disable:
    - errcheck
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - whitespace
    - copyloopvar
    - durationcheck

  settings:
    govet:
      disable:
        - fieldalignment
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - unparam

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
