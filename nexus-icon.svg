<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050811" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(48, 80)">
    <!-- Circuit nodes & traces -->
    <path d="M 28 50 L 28 84 C 28 98 42 98 56 98 L 78 98" stroke="#3b72e1" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 28 126 L 78 126" stroke="#3b72e1" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 28 126 L 28 190" stroke="#3b72e1" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 28 190 L 78 190" stroke="#182234" stroke-width="7" stroke-linecap="round" fill="none"/>

    <circle cx="28" cy="50" r="18" fill="#8cbbf4"/>
    <circle cx="28" cy="126" r="18" fill="#3b72e1"/>
    <circle cx="28" cy="190" r="18" fill="#182234"/>

    <!-- Top window tab -->
    <rect x="124" y="6" width="190" height="40" rx="12" fill="#70a4ea"/>

    <!-- Middle window body -->
    <rect x="78" y="38" width="250" height="142" rx="16" fill="#3b72e1"/>

    <!-- Front terminal card -->
    <g filter="url(#shadow)">
      <rect x="80" y="90" width="288" height="152" rx="20" fill="#182234" stroke="#243048" stroke-width="2"/>
      
      <!-- Terminal prompt >_ -->
      <path d="M 142 130 L 178 166 L 142 202" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="202" y1="202" x2="252" y2="202" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
</svg>
