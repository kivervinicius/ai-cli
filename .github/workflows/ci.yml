name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'

jobs:
  test-unix:
    name: Test Unix (${{ matrix.os }} - Go ${{ matrix.go }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.22', '1.24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v ./cmd/ai

  test-windows:
    name: Test Windows (${{ matrix.os }} - Go ${{ matrix.go }})
    strategy:
      matrix:
        os: [windows-latest]
        go: ['1.22', '1.24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -v ./cmd/ai
