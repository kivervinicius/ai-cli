name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'

jobs:
  frontend:
    name: Frontend (Typecheck, Lint, Unit & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install Dependencies (frozen)
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Typecheck Frontend
        working-directory: ./web
        run: bun run typecheck

      - name: Lint Frontend
        working-directory: ./web
        run: bun run lint

      - name: Unit Tests
        working-directory: ./web
        run: bun run test

      - name: Build Frontend
        working-directory: ./web
        run: bun run build

      - name: Verify embedded bundle is synchronized
        run: git diff --exit-code -- internal/control/web/dist

  test-linux:
    name: Linux E2E (Go ${{ matrix.go }})
    strategy:
      matrix:
        go: ['1.25']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Gofmt Check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -v -race ./...

      - name: PTY & Unix Socket E2E
        run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...

      - name: Runtime & Web E2E
        run: go test -race -v -count=1 ./internal/control/host/... ./internal/control/web/...

      - name: Build Binary
        run: go build -v ./cmd/nexus

  test-windows:
    name: Windows E2E (ConPTY, Named Pipe, PowerShell)
    strategy:
      matrix:
        go: ['1.25']
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: ConPTY & Named Pipe E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...

      - name: Runtime & Web E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/host/... ./internal/control/web/...

      - name: Build Binary
        run: go build -v -o nexus.exe ./cmd/nexus

      - name: PowerShell Smoke Test
        shell: pwsh
        run: |
          .\nexus.exe version
          .\nexus.exe control --help | Select-Object -First 5

  test-macos:
    name: macOS E2E (PTY, Socket, Resize, Install)
    strategy:
      matrix:
        go: ['1.25']
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -v -race ./...

      - name: PTY, Socket & Runtime E2E
        run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/... ./internal/control/host/...

      - name: Web E2E
        run: go test -race -v -count=1 ./internal/control/web/...

      - name: Build Binary
        run: go build -v -o nexus ./cmd/nexus

      - name: Installer Smoke Test (local install.sh)
        run: |
          ./nexus version
          # install.sh release-download path requires a GitHub release; build-from-source fallback is exercised by running from a source checkout
          bash -n install.sh

  snapshot:
    name: GoReleaser Snapshot Build
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows, test-macos, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean

      - name: Verify Artifacts
        run: |
          ls -la dist/
          ls dist/*.tar.gz dist/*.zip 2>/dev/null
          test -f dist/checksums.txt && echo "checksums present"
          test -f dist/nexus_Linux_x86_64.tar.gz && echo "linux/amd64 OK"
          test -f dist/nexus_Linux_arm64.tar.gz && echo "linux/arm64 OK"
          test -f dist/nexus_Darwin_x86_64.tar.gz && echo "darwin/amd64 OK"
          test -f dist/nexus_Darwin_arm64.tar.gz && echo "darwin/arm64 OK"
          test -f dist/nexus_Windows_x86_64.zip && echo "windows/amd64 OK"
          test -f dist/nexus_Windows_arm64.zip && echo "windows/arm64 OK"
