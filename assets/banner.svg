<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0,76 H1200 M0,152 H1200 M0,228 H1200 M0,304 H1200" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M150,0 V380 M300,0 V380 M450,0 V380 M600,0 V380 M750,0 V380 M900,0 V380 M1050,0 V380" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Glowing Header Badge -->
  <rect x="80" y="45" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="100" cy="61" r="5" fill="#22c55e"/>
  <text x="115" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">MULTI-ACCOUNT CLI</text>

  <!-- Title -->
  <text x="80" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#glow)">AI Manager (ai-cli)</text>
  <text x="80" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Sandbox isolation, live rate-limit bypassing &amp; in-session account switching for OpenAI Codex &amp; Google AGY.</text>

  <!-- Feature Cards -->
  <!-- Card 1: Codex Sandbox -->
  <g transform="translate(80, 205)" filter="url(#shadow)">
    <rect width="320" height="130" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#047857" fill-opacity="0.2"/>
    <text x="38" y="44" font-family="monospace" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">&gt;_</text>
    <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">OpenAI Codex</text>
    <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Isolated auth.json &amp; 5h quotas</text>
    <rect x="20" y="75" width="280" height="12" rx="6" fill="#0f172a"/>
    <rect x="20" y="75" width="210" height="12" rx="6" fill="#10b981"/>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#94a3b8">5h limit: 70% left · resets 17:34</text>
  </g>

  <!-- Card 2: Google AGY Sandbox -->
  <g transform="translate(440, 205)" filter="url(#shadow)">
    <rect width="320" height="130" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#0369a1" fill-opacity="0.2"/>
    <text x="38" y="45" font-family="monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">✦</text>
    <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Google AGY (Antigravity)</text>
    <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">D-Bus &amp; Keyring multi-instance</text>
    <rect x="20" y="75" width="280" height="12" rx="6" fill="#0f172a"/>
    <rect x="20" y="75" width="240" height="12" rx="6" fill="#38bdf8"/>
    <text x="20" y="105" font-family="monospace" font-size="11" fill="#94a3b8">Weekly limit: 83.13% left</text>
  </g>

  <!-- Card 3: In-Session Switch -->
  <g transform="translate(800, 205)" filter="url(#shadow)">
    <rect width="320" height="130" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="#7e22ce" fill-opacity="0.2"/>
    <text x="38" y="44" font-family="monospace" font-size="16" font-weight="bold" fill="#c084fc" text-anchor="middle">⇄</text>
    <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">In-Session /switch</text>
    <text x="70" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Live credential hot-swapping</text>
    <rect x="20" y="75" width="280" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="32" y="96" font-family="monospace" font-size="12" fill="#a855f7">/switch google-personal</text>
  </g>
</svg>
